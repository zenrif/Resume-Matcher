<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient (Brand Hyper Blue) -->
    <linearGradient id="rm-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Success Match Gradient -->
    <linearGradient id="rm-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Sparkle Gold Gradient -->
    <linearGradient id="rm-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Drop Shadow for Document & Badge Depth -->
    <filter id="rm-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#rm-blue-grad)" />
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="8" />

  <!-- Document Sheet (Resume Card) -->
  <g filter="url(#rm-shadow)">
    <!-- Main Sheet with Fold Cut -->
    <path d="M142 86 H266 L338 158 V372 C338 388 325 402 308 402 H142 C126 402 112 388 112 372 V116 C112 99 126 86 142 86 Z" fill="#FFFFFF" />
    <!-- Folded Corner Flap -->
    <path d="M264 86 V144 C264 152 270 158 278 158 H338 Z" fill="#BFDBFE" />

    <!-- Resume Header Lines -->
    <rect x="146" y="132" width="92" height="14" rx="7" fill="#1D4ED8" />
    <rect x="146" y="156" width="64" height="8" rx="4" fill="#93C5FD" />

    <!-- Section 1 (Experience) -->
    <rect x="146" y="190" width="156" height="8" rx="4" fill="#CBD5E1" />
    <rect x="146" y="208" width="128" height="8" rx="4" fill="#E2E8F0" />
    <rect x="146" y="226" width="144" height="8" rx="4" fill="#E2E8F0" />

    <!-- Section 2 (Skills & Match) -->
    <rect x="146" y="256" width="88" height="8" rx="4" fill="#94A3B8" />
    <rect x="146" y="274" width="112" height="8" rx="4" fill="#E2E8F0" />
    <rect x="146" y="292" width="76" height="8" rx="4" fill="#E2E8F0" />
  </g>

  <!-- AI Intelligence Sparkles -->
  <path d="M382 78 C382 98 398 114 418 114 C398 114 382 130 382 150 C382 130 366 114 346 114 C366 114 382 98 382 78 Z" fill="url(#rm-gold-grad)" />
  <circle cx="414" cy="74" r="5" fill="#FEF08A" />

  <!-- Match Badge (Success Checkmark Circle) -->
  <g filter="url(#rm-shadow)">
    <!-- Outer Rim Cutout -->
    <circle cx="340" cy="340" r="76" fill="url(#rm-green-grad)" stroke="#FFFFFF" stroke-width="12" />
    <!-- Crisp Checkmark -->
    <path d="M308 340 L330 362 L374 316" fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
